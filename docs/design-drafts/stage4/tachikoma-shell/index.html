<!DOCTYPE html>
<!-- PROTOTYPE（throwaway）· wayfinder ticket #37 · Tachikoma 外壳 v4 像素级复刻
     参考图（唯一视觉真相）：docs/UI-draft/804f1f634d5c9bd73bb7f196c9cedc48.png（launch-plan 频道）
     业务行为（唯一行为真相）：wayfinder map #20 已定 decisions
     v4 = 严格按美术稿逐区域复刻：
       ├ 左栏 260px：Tachikoma logo + Home/Inbox/Agents/Projects/Search/Settings
       │   + Channels（general/launch-plan/product/engineering/design/research/random）
       │   + Direct messages（alice/bob/charlie/Add people）+ 底部用户
       ├ 中区：chat-head（← # launch-plan ☆ + 搜索 + 日语标语）
       │   + banner（攻壳城市 + PUBLIC CHANNEL + # launch-plan + From intelligence to impact.）
       │   + 消息流 + 输入框（+ 📎 😊 @ Aa | All participants ⌄ | ↑）
       └ 右栏 320px：Channel（# launch-plan + 描述 + Product/GTM/Launch tags）
           + 统计行（4 Members / 3 Agents / 12 Files）
           + Description + Members(4) See all + Active agents(3) See all
           + Pinned(2) +
     状态 GIF：docs/UI-draft/state/*.gif（sleep/ease/tired/super_tired/ran_out）
     约束：#36 词表 / #17 五档色 / #34 本机视角 / #29 正式消息 / #30 pending
     throwaway：state 全在内存、数据是假的、启动 = 双击本文件。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Tachikoma 外壳 v4 · 茶话间 + agent（ticket #37）</title>
<style>
  :root{
    /* —— 美术稿采样色（804f1f6…png，PIL 逐像素采样）—— */
    --bg:#0b1c2a;            /* 消息流/主区背景 */
    --bg2:#09121d;           /* 左栏 sidebar */
    --panel:#0a151e;         /* 右栏详情面板 */
    --panel2:#101b28;        /* 输入框/卡片表面 */
    --line:#1a2a3a;          /* 分隔线 */
    --line2:#24344a;         /* 较强分隔线/边框 */
    --fg:#e6edf3;
    --fg2:#8b949e;
    --fg3:#5a6a7a;
    --accent:#e94560;        /* Tachikoma 红（美术稿主色） */
    --accent-soft:rgba(233,69,96,.12);
    --accent2:#0adf80;       /* 绿（Online/Active 状态） */
    /* —— agent 五档（#17 契约）—— */
    --st-idle:#58a6ff; --st-easy:#3fb950; --st-busy:#d29922; --st-over:#f0883e; --st-blow:#f85149;
    /* —— 布局蓝图（自美术稿测量，1536×1024）—— */
    --rail-w:260px; --details-w:320px; --chat-head-h:66px; --banner-h:185px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#04070c;color:var(--fg);overflow:hidden;
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}

  /* ============ 应用窗口（美术稿比例）============ */
  .app{height:100vh;display:grid;grid-template-columns:var(--rail-w) 1fr var(--details-w)}

  /* ============ 左栏 ============ */
  .rail{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .macos{display:flex;gap:7px;padding:13px 16px 11px}
  .macos i{width:11px;height:11px;border-radius:50%;display:block}
  .macos i:nth-child(1){background:#ff5f57}.macos i:nth-child(2){background:#febc2e}.macos i:nth-child(3){background:#28c840}

  .brand{display:flex;align-items:center;gap:11px;padding:4px 18px 16px;border-bottom:1px solid var(--line)}
  .brand img{width:46px;height:46px;object-fit:contain;image-rendering:pixelated}
  .brand .t1{font-size:17px;font-weight:800;letter-spacing:.01em}
  .brand .t2{font-size:9px;color:var(--fg3);letter-spacing:.1em;margin-top:1px}

  .nav{padding:10px 8px 4px}
  .nav a{display:flex;align-items:center;gap:11px;padding:6px 10px;border-radius:7px;color:var(--fg2);text-decoration:none;font-size:13.5px;font-weight:500}
  .nav a:hover{background:rgba(255,255,255,.04);color:var(--fg)}
  .nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 2px 0 0 var(--accent)}
  .nav a .ico{width:20px;text-align:center;opacity:.85;font-size:14px}

  .scroll{flex:1;overflow-y:auto;min-height:0;padding:2px 8px 10px}
  .scroll::-webkit-scrollbar{width:4px}
  .scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}

  .sect{font-size:10px;font-weight:700;color:var(--fg3);letter-spacing:.1em;text-transform:uppercase;padding:16px 10px 5px;display:flex;justify-content:space-between;align-items:center}
  .sect .add{color:var(--fg3);font-size:13px;cursor:pointer;border:0;background:none}
  .sect .add:hover{color:var(--fg)}

  .chan{display:flex;align-items:center;gap:8px;padding:4px 10px;border-radius:6px;cursor:pointer;color:var(--fg2);font-size:13px;position:relative}
  .chan:hover{background:rgba(255,255,255,.04);color:var(--fg)}
  .chan.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .chan.on::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:2px;background:var(--accent);border-radius:1px}
  .chan .hash{color:var(--fg3);width:13px;text-align:center;flex:0 0 auto;font-weight:600}
  .chan.on .hash{color:var(--accent)}
  .chan .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .dm{display:flex;align-items:center;gap:9px;padding:4px 10px;border-radius:6px;cursor:pointer;color:var(--fg2);font-size:13px}
  .dm:hover{background:rgba(255,255,255,.04);color:var(--fg)}
  .dm .fa{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px;position:relative}
  .dm .fa .dot{position:absolute;right:-1px;bottom:-1px;width:7px;height:7px;border-radius:50%;border:2px solid var(--bg2);background:var(--accent2)}
  .dm .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dm.add{color:var(--fg3)}
  .dm.add:hover{color:var(--fg2)}

  .me{margin-top:auto;display:flex;align-items:center;gap:9px;padding:11px 14px;border-top:1px solid var(--line)}
  .me .fa{width:28px;height:28px;border-radius:50%;background:#3a4a5a;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px;position:relative;flex:0 0 auto}
  .me .fa .dot{position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;border:2px solid var(--bg2);background:var(--accent2)}
  .me .nm{font-size:12.5px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me .team{font-size:9.5px;color:var(--fg3)}
  .me .dots{color:var(--fg3);cursor:pointer;letter-spacing:2px}

  /* ============ 中区 ============ */
  .chat{display:flex;flex-direction:column;min-height:0;background:var(--bg);position:relative}
  .chat-head{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 16px;height:var(--chat-head-h);border-bottom:1px solid var(--line)}
  .chat-head .back{color:var(--fg3);font-size:16px;cursor:pointer;width:20px}
  .chat-head .hash{font-size:17px;color:var(--fg3)}
  .chat-head .nm{font-size:16px;font-weight:700}
  .chat-head .star{color:var(--fg3);font-size:14px;cursor:pointer}
  .chat-head .topic{font-size:11.5px;color:var(--fg3);margin-top:1px}
  .chat-head .sp{flex:1}
  .chat-head .search{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:6px 12px;color:var(--fg3);font-size:12px;min-width:220px}
  .chat-head .search kbd{margin-left:auto;font-size:10px;background:var(--bg2);border-radius:4px;padding:1px 6px;border:1px solid var(--line2);font-family:inherit}
  .chat-head .jp{text-align:right;line-height:1.3;margin-left:14px}
  .chat-head .jp .j1{font-size:11px;color:var(--fg2)}
  .chat-head .jp .j2{font-size:7.5px;color:var(--fg3);letter-spacing:.14em}

  .banner{flex:0 0 auto;position:relative;height:var(--banner-h);overflow:hidden;border-bottom:1px solid var(--line)}
  .banner img{width:100%;height:100%;object-fit:cover}
  .banner .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,28,42,.1) 30%,rgba(11,28,42,.92) 90%);display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px 14px}
  .banner .kick{font-size:9px;letter-spacing:.18em;color:var(--accent);text-transform:uppercase;font-weight:700;margin-bottom:5px}
  .banner h2{font-size:21px;font-weight:800;display:flex;align-items:center;gap:8px}
  .banner h2 .hash{color:var(--fg3);font-size:18px}
  .banner .sub{font-size:12px;color:var(--fg2);margin-top:2px}

  .msgs{flex:1;overflow-y:auto;min-height:0;padding:14px 22px}
  .msgs::-webkit-scrollbar{width:4px}
  .msgs::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}
  .day{text-align:center;font-size:10px;color:var(--fg3);letter-spacing:.1em;text-transform:uppercase;margin:2px 0 16px;position:relative}
  .day::before,.day::after{content:'';position:absolute;top:50%;width:36%;height:1px;background:var(--line)}
  .day::before{left:0}.day::after{right:0}

  .msg{display:flex;gap:12px;margin-bottom:18px}
  .msg .fa{width:38px;height:38px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;position:relative}
  .msg .fa.round{border-radius:50%;color:#fff;font-weight:700;font-size:14px}
  .msg .fa img,.msg .fa gif{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;border-radius:8px;background:var(--panel2)}
  .msg .body{min-width:0;flex:1}
  .msg .who{display:flex;gap:7px;align-items:baseline}
  .msg .who .nm{font-weight:700;font-size:13.5px}
  .msg .who .tm{font-size:10.5px;color:var(--fg3)}
  .msg .txt{font-size:13.5px;color:var(--fg);margin-top:3px;line-height:1.6;white-space:pre-wrap}
  .msg .file{display:flex;align-items:center;gap:10px;margin-top:8px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;max-width:400px}
  .msg .file .fi{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:10px;color:#fff;flex:0 0 auto}
  .msg .file .fm{flex:1;min-width:0}
  .msg .file .fm .fn{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .msg .file .fm .fs{font-size:10.5px;color:var(--fg3);margin-top:1px}
  .msg .file .dl{color:var(--fg3);font-size:13px}
  .msg .react{display:flex;gap:6px;margin-top:7px}
  .msg .react span{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--fg2);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 8px}

  /* 输入框（美术稿底部 composer） */
  .composer{flex:0 0 auto;padding:10px 22px 14px}
  .box{display:flex;gap:4px;align-items:center;background:var(--panel2);border:1px solid var(--line2);border-radius:12px;padding:11px 14px}
  .box .plus{width:26px;height:26px;border-radius:50%;border:1px solid var(--line2);background:transparent;color:var(--fg3);font-size:15px;cursor:pointer;flex:0 0 auto}
  .box input{flex:1;border:0;background:transparent;font:inherit;font-size:13.5px;color:var(--fg);outline:none;padding:0 6px}
  .box input::placeholder{color:var(--fg3)}
  .box .ic{color:var(--fg3);font-size:14px;padding:0 5px;cursor:pointer}
  .box .who{font-size:11.5px;color:var(--fg2);border:1px solid var(--line2);border-radius:8px;padding:4px 10px;cursor:pointer;white-space:nowrap;margin-left:6px}
  .box .send{background:var(--accent);color:#fff;border:0;border-radius:9px;width:32px;height:32px;font-size:14px;cursor:pointer;flex:0 0 auto;margin-left:8px}

  /* 底部状态条 */
  .statusbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;
             padding:5px 22px;font-size:8.5px;letter-spacing:.16em;color:var(--fg3);text-transform:uppercase;
             border-top:1px solid var(--line);background:var(--bg)}
  .statusbar b{color:var(--accent);font-weight:700}

  /* ============ 右栏 ============ */
  .details{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0;padding:14px 14px 40px}
  .details::-webkit-scrollbar{width:4px}
  .details::-webkit-scrollbar-thumb{background:var(--line2);border-radius:2px}

  .card{background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:11px;padding:13px 14px;margin-bottom:11px}
  .card h4{font-size:10px;font-weight:700;color:var(--fg3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .card h4 .lnk{color:var(--fg2);font-size:11px;text-transform:none;letter-spacing:0;cursor:pointer;font-weight:500}
  .card h4 .plus{color:var(--fg3);cursor:pointer;font-size:13px}

  .ch-id{display:flex;gap:8px;align-items:baseline;margin-bottom:4px}
  .ch-id .hash{font-size:16px;color:var(--fg3)}
  .ch-id .nm{font-size:16px;font-weight:800}
  .ch-desc{font-size:12px;color:var(--fg2);line-height:1.55;margin:6px 0 10px}
  .ch-tags{display:flex;gap:5px;flex-wrap:wrap}
  .ch-tags span{font-size:10.5px;color:var(--fg2);border:1px solid var(--line2);border-radius:999px;padding:2px 9px}

  .stats{display:flex;margin:10px 0 2px;border-top:1px solid var(--line);padding-top:10px}
  .stats .st{flex:1;text-align:center}
  .stats .st + .st{border-left:1px solid var(--line)}
  .stats .st b{display:block;font-size:16px;font-weight:800}
  .stats .st span{font-size:9.5px;color:var(--fg3);letter-spacing:.06em;text-transform:uppercase}

  .mrow{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:12.5px}
  .mrow .fa{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:10px;flex:0 0 auto;position:relative}
  .mrow .fa .dot{position:absolute;right:-1px;bottom:-1px;width:6px;height:6px;border-radius:50%;border:2px solid var(--panel);background:var(--accent2)}
  .mrow .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mrow .you{font-size:9.5px;color:var(--fg3)}

  .arow{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:12.5px}
  .arow .tachi{width:28px;height:28px;object-fit:contain;image-rendering:pixelated;border-radius:6px;background:rgba(255,255,255,.04);padding:1px;flex:0 0 auto}
  .arow .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg);font-weight:500}
  .arow .st{font-size:10px;color:var(--fg2);display:flex;align-items:center;gap:5px;flex:0 0 auto}
  .arow .st i{width:6px;height:6px;border-radius:50%;background:var(--accent2);font-style:normal}
  .arow .st i.idle{background:var(--fg3)}
  .arow .st i.off{background:var(--fg3);opacity:.5}

  .netmap{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;padding:7px;margin-bottom:9px}
  .netmap svg{display:block;width:100%;height:auto}
  .netmap .cap{font-size:9px;color:var(--fg3);margin-top:4px;display:flex;justify-content:space-between;letter-spacing:.04em}

  .prow{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:12px}
  .prow .fi{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:8px;color:#fff;flex:0 0 auto}
  .prow .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prow .meta{font-size:10px;color:var(--fg3);flex:0 0 auto;text-align:right;line-height:1.3}
</style>
</head>
<body>

<div class="app">
  <!-- ══════════ 左栏 ══════════ -->
  <aside class="rail" id="rail"></aside>

  <!-- ══════════ 中区：群聊 ══════════ -->
  <section class="chat">
    <div class="chat-head" id="chatHead"></div>
    <div class="banner">
      <img src="tachikoma-assets/channel-banner.png" alt="">
      <div class="ov" id="bannerOv"></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <div class="box">
        <button class="plus">＋</button>
        <input id="composerInput" placeholder="Message #launch-plan…">
        <span class="ic">📎</span>
        <span class="ic">😊</span>
        <span class="ic">@</span>
        <span class="ic">Aa</span>
        <span class="who">All participants ⌄</span>
        <button class="send" id="sendBtn">↑</button>
      </div>
    </div>
    <div class="statusbar">
      <span><b>HUMAN</b> × AI × A BRIGHTER TOMORROW</span>
      <span>TACHIKOMA · V1.0.0</span>
    </div>
  </section>

  <!-- ══════════ 右栏：详情 ══════════ -->
  <aside class="details" id="details"></aside>
</div>

<script>
/* =====================================================================
 * 塔奇克马状态 GIF + 精灵 PNG
 * ===================================================================== */
const GIF = {idle:'state/sleep.gif', easy:'state/ease.gif', busy:'state/tired.gif', over:'state/super_tired.gif', blow:'state/ran_out.gif', off:'state/sleep.gif'};
const PNG = {red:'tachikoma-assets/tachikoma-red.png', blue:'tachikoma-assets/tachikoma-blue.png', white:'tachikoma-assets/tachikoma-white.png'};
const STATUS = ['idle','easy','busy','over','blow','off'];
const SL = {idle:'空闲',easy:'轻松',busy:'有点忙',over:'过载',blow:'快炸了',off:'离线'};

const CHANNELS = [
  {id:'c-gen',  nm:'general',     topic:'团队日常', unread:0},
  {id:'c-city', nm:'launch-plan', topic:'From intelligence to impact.', unread:0},
  {id:'c-prod', nm:'product',     topic:'', unread:0},
  {id:'c-eng',  nm:'engineering', topic:'', unread:0},
  {id:'c-des',  nm:'design',      topic:'', unread:0},
  {id:'c-res',  nm:'research',    topic:'', unread:0},
  {id:'c-rand', nm:'random',      topic:'', unread:0},
];

const DMS = [
  {id:'d-alice', nm:'alice-tyler', hue:'#5a6a7a', st:'on'},
  {id:'d-bob',   nm:'bob-tyler',   hue:'#4a5a6a', st:'on'},
  {id:'d-chrl',  nm:'charlie',     hue:'#3a4a5a', st:'on'},
];

const AGENTS = [
  {id:'a-planner',  nm:'Planner',    role:'Strategic planning and go-to-market execution.', tachi:'red',   status:'busy', pct:14, depth:1, pending:false},
  {id:'a-research', nm:'Researcher', role:'Deep research, competitive analysis, and insights.', tachi:'blue',  status:'easy', pct:6,  depth:2, pending:false},
  {id:'a-builder',  nm:'Builder',    role:'Implementation, prototyping, and technical execution.', tachi:'white', status:'idle', pct:0,  depth:3, pending:true},
];

const MSGS = [
  {who:'me',    txt:"Kicking off our launch plan discussion here. Let's align on audience, positioning, and\nkey milestones before we draft the GTM plan.", t:'9:12 AM', reactions:[{e:'❤️',n:3},{e:'🙌',n:2}]},
  {who:'a-planner', txt:"I've prepared a first-pass outline based on our recent research.", t:'9:14 AM',
   file:{fn:'Tachikoma_Launch_Plan_v0.1.pdf', fs:'Strategy · 14 pages · 2.4 MB', c:'#e94560'}},
  {who:'d-alice', txt:"This looks solid! I especially like the audience segmentation.\nShould we also include a section on community and developer partnerships?", t:'9:20 AM'},
  {who:'a-research', txt:"Here are some additional insights on community channels and potential partners.", t:'9:23 AM',
   file:{fn:'Community_Partners_Research.pdf', fs:'Insights · 8 pages · 1.1 MB', c:'#58a6ff'}},
  {who:'d-bob', txt:"Great. I'll take a pass on the messaging and work with design on the launch assets.\nLet's sync tomorrow to review.", t:'9:27 AM', reactions:[{e:'❤️',n:3},{e:'🙌',n:2}]},
];

const state = {chan:'c-city', msgs:[...MSGS], tick:0};

/* ---------- 渲染 ---------- */
const rail = document.getElementById('rail');
const details = document.getElementById('details');

function agentImg(a, size=28) {
  const src = a.status==='off' ? GIF.off : GIF[a.status];
  const gray = a.status==='off' ? 'filter:grayscale(1) opacity(.5);' : '';
  return `<img class="tachi" src="${src}" style="width:${size}px;height:${size}px;${gray}" alt="${a.nm}" title="${a.nm} · ${SL[a.status]}">`;
}

function renderRail() {
  rail.innerHTML = `
    <div class="macos"><i></i><i></i><i></i></div>
    <div class="brand">
      <img src="${PNG.red}" alt="Tachikoma">
      <div>
        <div class="t1">Tachikoma</div>

        <span class="hash">#</span><span class="nm">${c.nm}</span>

}

function renderChatHead() {
  const c = CHANNELS.find(x=>x.id===state.chan);
  document.getElementById('chatHead').innerHTML = `
    <span class="back">←</span>
    <span class="hash">#</span>
    <span class="nm">${c.nm}</span>
    <span class="star">☆</span>
    <div>
      <div class="topic">${c.topic||c.nm}</div>
    </div>
    <span class="sp"></span>
    <div class="search">🔍 Search messages, files, or people… <kbd>⌘ K</kbd></div>
    <div class="jp"><div class="j1">一緒に、もっと先へ。</div><div class="j2">FURTHER, TOGETHER.</div></div>`;
  document.getElementById('bannerOv').innerHTML = `
    <div class="kick">Public Channel</div>
    <h2><span class="hash">#</span> ${c.nm}</h2>
    <div class="sub">${c.topic||''}</div>`;
  document.getElementById('composerInput').placeholder = `Message #${c.nm}…`;
}

function whoMeta(id) {
  if(id==='me') return {kind:'human', nm:'You', hue:'#5a6a7a', st:'easy'};
  const d = DMS.find(x=>x.id===id);
  if(d) return {kind:'human', nm:d.nm, hue:d.hue, st:'easy'};
  const a = AGENTS.find(x=>x.id===id);
  return {kind:'agent', ...a};
}

function renderMsgs() {
  document.getElementById('msgs').innerHTML = `
    <div class="day">Today</div>
    ${state.msgs.map(m=>{
      const w = whoMeta(m.who);
      const fa = w.kind==='human'
        ? `<div class="fa round" style="background:${w.hue}">${w.nm[0].toUpperCase()}</div>`
        : `<div class="fa">${agentImg(w,38)}</div>`;
      const ai = w.kind==='agent' ? `<span style="font-size:9px;font-weight:800;color:#04101f;background:var(--st-idle);border-radius:3px;padding:0 4px;margin-left:2px">AI</span>` : '';
      const file = m.file ? `<div class="file">
        <div class="fi" style="background:${m.file.c}">PDF</div>
        <div class="fm"><div class="fn">${m.file.fn}</div><div class="fs">${m.file.fs}</div></div>
        <span class="dl">⬇</span>
      </div>` : '';
      const react = m.reactions?.length ? `<div class="react">${m.reactions.map(r=>`<span>${r.e} ${r.n}</span>`).join('')}</div>` : '';
      return `<div class="msg">${fa}
        <div class="body">
          <div class="who"><span class="nm">${w.nm}</span>${ai}<span class="tm">${m.t}</span></div>
          <div class="txt">${m.txt}</div>${file}${react}
        </div>
      </div>`;
    }).join('')}`;
  const el = document.getElementById('msgs'); el.scrollTop = el.scrollHeight;
}

function miniNetmap() {
  const w=264, h=118, cx=w/2, cy=h/2;
  const nodes = AGENTS.map((a,i)=>{
    const ang = (i/AGENTS.length)*Math.PI*2 - Math.PI/2;
    return {a, x:cx+Math.cos(ang)*48, y:cy+Math.sin(ang)*36};
  });
  const edges = nodes.map(n=>`<line x1="${cx}" y1="${cy}" x2="${n.x}" y2="${n.y}" stroke="#24344a" stroke-width="1" ${n.a.status==='off'?'stroke-dasharray="3 3"':''}/>`).join('');
  const els = nodes.map(n=>`<g data-agent="${n.a.id}" style="cursor:pointer">
    <image href="${PNG[n.a.tachi]}" x="${n.x-12}" y="${n.y-12}" width="24" height="24" style="image-rendering:pixelated;${n.a.status==='off'?'filter:grayscale(1) opacity(.5);':''}"/>
    <circle cx="${n.x+9}" cy="${n.y+9}" r="3" fill="${n.a.status==='off'?'#5a6a7a':({idle:'#58a6ff',easy:'#3fb950',busy:'#d29922',over:'#f0883e',blow:'#f85149'}[n.a.status])}"/>
  </g>`).join('');
  return `<div class="netmap">
    <svg viewBox="0 0 ${w} ${h}">
      ${edges}
      <image href="${PNG.red}" x="${cx-14}" y="${cy-14}" width="28" height="28" style="image-rendering:pixelated"/>
      ${els}
    </svg>
    <div class="cap"><span>派遣网络图（#17 星系图 · 本机 #34）</span><span>峰值 31</span></div>
  </div>`;
}

function renderDetails() {
  const c = CHANNELS.find(x=>x.id===state.chan);
  const files = [
    {fn:'Tachikoma_Launch_Plan_v0.1.pdf', sz:'2.4 MB · Mar 10', c:'#e94560'},
    {fn:'Market_Research_Summary.pdf',      sz:'1.1 MB · Mar 8',  c:'#58a6ff'},
  ];
  details.innerHTML = `
    <div class="card">
      <h4>Channel</h4>
      <div class="ch-id"><span class="hash">#</span><span class="nm">${c.nm}</span></div>
      <div class="ch-desc">${c.topic||c.nm}</div>
      <div class="ch-tags"><span>Product</span><span>GTM</span><span>Launch</span></div>
      <div class="stats">
        <div class="st"><b>${DMS.length+1}</b><span>Members</span></div>
        <div class="st"><b>${AGENTS.length}</b><span>Agents</span></div>
        <div class="st"><b>12</b><span>Files</span></div>
      </div>
    </div>
    <div class="card">
      <h4>Description <span class="lnk">✎</span></h4>
      <div class="ch-desc">Planning, discussion, and execution for our public launch. From strategy to shipped.</div>
    </div>
    <div class="card">
      <h4>Members (${DMS.length+1}) <span class="lnk">See all →</span></h4>
      <div class="mrow"><div class="fa" style="background:#3a4a5a">N<span class="dot"></span></div><span class="nm">npub1mock…</span><span class="you">You</span></div>
      ${DMS.map(d=>`<div class="mrow"><div class="fa" style="background:${d.hue}">${d.nm[0].toUpperCase()}<span class="dot"></span></div><span class="nm">${d.nm}</span></div>`).join('')}
    </div>
    <div class="card">
      <h4>Active agents (${AGENTS.filter(a=>a.status!=='off').length}) <span class="lnk">See all →</span></h4>
      ${miniNetmap()}
      ${AGENTS.map(a=>{
        const dot = a.status==='idle'?'idle':a.status==='off'?'off':'';
        const lbl = a.pending?'Pending':a.status==='idle'?'Idle':a.status==='off'?'Offline':'Online';
        return `<div class="arow">${agentImg(a,28)}
          <span class="nm">${a.nm}</span>
          <span class="st">${a.pending?'<i style="background:var(--st-busy)"></i>':''}<i class="${dot}"></i>${lbl}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="card">
      <h4>Pinned (${files.length}) <span class="plus">＋</span></h4>
      ${files.map(f=>`<div class="prow">
        <div class="fi" style="background:${f.c}">PDF</div>
        <span class="nm">${f.fn}</span><span class="meta">${f.sz}</span>
      </div>`).join('')}
    </div>`;
}

function renderAll() { renderRail(); renderChatHead(); renderMsgs(); renderDetails(); }

/* ---------- 交互 ---------- */
document.addEventListener('click', e=>{
  const c = e.target.closest('[data-chan]');
  if(c){ state.chan=c.dataset.chan; renderAll(); return; }
  const ag = e.target.closest('[data-agent]');
  if(ag){
    const a = AGENTS.find(x=>x.id===ag.dataset.agent);
    if(a?.pending && confirm(`「${a.nm}」pending 收集期（#30）。确认开工？`)){ a.pending=false; a.status='easy'; a.pct=6; renderAll(); }
    return;
  }
  if(e.target.closest('#sendBtn')){ doSend(); return; }
});
document.getElementById('composerInput').addEventListener('keydown', e=>{ if(e.key==='Enter') doSend(); });
function doSend(){
  const inp = document.getElementById('composerInput');
  const t = inp.value.trim(); if(!t) return;
  state.msgs.push({who:'me', txt:t, t:new Date().toTimeString().slice(0,5)});
  inp.value=''; renderAll();
}

/* 演示：每 4s 漂移一档 + 偶发正式消息（#29） */
const REPLIES = ['收到，正在处理。','这一步需要 2 分钟，稍等。','已完成，结果已写进 handoff。','遇到歧义，按 emergence-ab.md 第 3 条执行。'];
setInterval(()=>{
  state.tick++;
  const live = AGENTS.filter(a=>a.status!=='off' && !a.pending);
  if(live.length){
    const a = live[Math.floor(Math.random()*live.length)];
    const i = STATUS.indexOf(a.status);
    a.status = STATUS[Math.min(STATUS.length-2, Math.max(0, i+(Math.random()<.5?-1:1)))];
    a.pct = {idle:0,easy:6,busy:14,over:27,blow:43}[a.status] ?? 0;
    if(Math.random()<.2) state.msgs.push({who:a.id, txt:REPLIES[Math.floor(Math.random()*REPLIES.length)], t:new Date().toTimeString().slice(0,5)});
  }
  renderAll();
}, 4000);

renderAll();
</script>
